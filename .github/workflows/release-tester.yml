name: Release WatchWolf-Tester JAR

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Tester JAR
        run: mvn -B clean package
      - name: Check release tag against artifact version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          version="${RELEASE_TAG#v}"
          test -s "target/watchwolf-tester-${version}.jar"
      - name: Create Tester release with JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          artifact="watchwolf-tester-${version}.jar"
          (cd target && sha256sum "$artifact" > "$artifact.sha256")
          gh release create "$RELEASE_TAG" "target/$artifact" "target/$artifact.sha256" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
